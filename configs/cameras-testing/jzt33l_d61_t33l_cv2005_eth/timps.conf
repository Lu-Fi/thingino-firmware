# JZT33L D61 module: CV2005 on I2C0 at 0x35 with MCLK0 (the open sinfo leaves
# /proc/jz/sensor empty, openimp #513), 1080p main + 360p sub stream.
sensor.model = cv2005
sensor.i2c_addr = 0x35
sensor.mclk = 0
sensor.fps = 25
sensor.width = 1920
sensor.height = 1080
video0.width = 1920
video0.height = 1080
video1.width = 640
video1.height = 360
